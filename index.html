<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ClassSync v2 – Digital Attendance</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14172b;--mute:#6b7190;--line:#e4e7f2;--pri:#4f46e5;--pri2:#7c3aed;--acc:#14b8a6;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--side:#1e1b4b;--soft:#eef0ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b33;--ink:#eef0ff;--mute:#9aa1c7;--line:#262b4d;--side:#0a0c1c;--soft:#222752;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b33;--ink:#eef0ff;--mute:#9aa1c7;--line:#262b4d;--side:#0a0c1c;--soft:#222752;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h2,h3{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:600;font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad);color:#fff;border:0}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
label{font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 4px}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(150deg,var(--side),var(--pri) 70%,var(--acc));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero h1{font-size:40px;margin:0}.hero p{opacity:.85;max-width:420px}
.chips span{display:inline-block;background:#ffffff22;border-radius:99px;padding:5px 12px;margin:3px 3px 0 0;font-size:13px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--pri2));display:grid;place-items:center;font-style:normal}
.form{padding:32px;display:flex;align-items:center;justify-content:center}.form .card{width:100%;max-width:420px}
.tabs{display:flex;background:var(--soft);border-radius:10px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}.tabs .on{background:var(--card);color:var(--pri)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .nav{background:none;border:0;color:#c4c8ee;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}.side .nav.on{background:#ffffff1a;color:#fff}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;background:#ffffff12;border-radius:12px;font-size:13px}.me small{opacity:.7;display:block}
main{padding:28px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{border-left:4px solid var(--pri)}.stat b{font-size:28px;display:block}.stat span{color:var(--mute);font-size:13px}
.banner{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:linear-gradient(var(--acc),var(--pri));border-radius:8px 8px 3px 3px;margin-bottom:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mute);padding:8px}td{padding:10px 8px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;font-weight:600}.who small{display:block;color:var(--mute);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:700;color:var(--mute)}
.seg .P.on{background:var(--ok);color:#fff}.seg .A.on{background:var(--bad);color:#fff}.seg .L.on{background:var(--warn);color:#fff}.seg .E.on{background:var(--pri);color:#fff}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.good{background:#10b98122;color:var(--ok)}.low{background:#ef444422;color:var(--bad)}.mid{background:#f59e0b22;color:var(--warn)}
.meter{height:7px;background:var(--line);border-radius:9px;min-width:70px;flex:1}.meter i{display:block;height:100%;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{padding:9px 0;border-radius:8px;font-size:13px;background:var(--soft)}
.cal .P{background:var(--ok);color:#fff}.cal .A{background:var(--bad);color:#fff}.cal .L{background:var(--warn);color:#fff}.cal .E{background:var(--pri);color:#fff}.cal .H{opacity:.4;text-decoration:line-through}
.cal .h{background:none;color:var(--mute);font-size:11px}.cal small{display:block;font-size:10px}
.cal .tod{outline:2px solid var(--pri);outline-offset:1px}.cal .clk{cursor:pointer}.cal.big div{min-height:56px}.cal.big .h{min-height:0}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}.modal .card{max-width:480px;width:100%}
pre{white-space:pre-wrap;background:var(--soft);padding:14px;border-radius:12px;font:13px/1.5 inherit;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:99;max-width:90vw}
.tbtn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:16px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:19px;box-shadow:0 4px 14px #0003}
@media(max-width:820px){.auth,.app,.cols{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:30px}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.me{margin:0 0 0 auto}main{padding:16px}}
</style></head><body><div id="root"></div><div id="modal"></div>
<button id="tb" class="tbtn" onclick="theme()" aria-label="Switch light or dark theme">🌓</button>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date(),T=iso(today),pm=new Date(today.getFullYear(),today.getMonth()-1,1),PM=iso(pm).slice(0,7),CM=T.slice(0,7);
const mname=m=>new Date(m.slice(0,4),m.slice(5,7)-1,1).toLocaleString('en',{month:'long',year:'numeric'});
const STAFF_KEY='STAFF2026'; /* demo only – a real app must verify this on a server */
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cs:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=()=>String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
const normPh=p=>{p=String(p||'').replace(/\D/g,'');return p.length===10?'91'+p:p};
const okMail=e=>!e||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
let S,mem=null,view='dash',month=PM,adate=T,cur={},ph='',tab='login',cal=CM,dirty=false,askFn=null;
const isWork=d=>{if(S.hol.includes(iso(d)))return false;const w=d.getDay();return w===0?false:w===6?S.cfg.sat:true};
async function seed(){
 const N=["Aman Sharma","Riya Verma","Kabir Singh","Priya Meena","Rohan Gupta","Sneha Joshi","Arjun Rathore","Diya Khandelwal"],base=[96,90,72,93,64,86,95,78],att={};
 const users=[{id:1,role:'teacher',name:'Prof. Meera Joshi',cls:'BCA Sem 3',dept:'Computer Science',photo:'',pw:await H('teacher123')}];
 for(let i=0;i<N.length;i++)users.push({id:i+2,role:'student',roll:101+i,name:N[i],cls:'BCA Sem 3',dept:'Computer Science',pe:`parent${i+1}@example.com`,pp:'919800000'+(100+i),photo:'',pw:await H('student123')});
 S={users,att,log:[],audit:[],hol:[],cfg:{th:75,lateP:true,sat:false},me:null,theme:'',sess:null};
 const d=new Date(pm);let k=0;
 for(;iso(d)<T;d.setDate(d.getDate()+1)){if(!isWork(d))continue;k++;const m={};users.slice(1).forEach((u,i)=>{const v=(i*37+k*53+k*k*7)%100;m[u.id]=v<base[i]?'P':v<base[i]+4?'L':'A'});att[iso(d)]=m}
}
const API='/api/data',LOC='classsync2';
let saveT=null,online=null,lastSrv='';
const shared=()=>{const{me,theme,...rest}=S;return rest}; /* me + theme stay private to each browser */
function save(){mem=JSON.stringify(S);try{localStorage.setItem(LOC,mem)}catch(e){}clearTimeout(saveT);saveT=setTimeout(push,300)}
async function push(){const body=JSON.stringify(shared());try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body});if(!r.ok)throw 0;lastSrv=body;if(online===false)toast('Reconnected to server');online=true}catch(e){if(online!==false)toast('Server offline – saved in this browser only');online=false}}
async function pull(){const r=await fetch(API);if(r.status===204)return null;if(!r.ok)throw 0;return await r.text()}
async function sync(){try{const t=await pull();if(t&&t!==lastSrv){S=Object.assign(JSON.parse(t),{me:S.me,theme:S.theme});S.hol=S.hol||[];S.audit=S.audit||[];lastSrv=t;return true}}catch(e){}return false}
const audit=t=>{S.audit.push({t,at:new Date().toLocaleString(),by:(me()||{}).name||'system'});S.audit=S.audit.slice(-100)};
const studs=()=>S.users.filter(u=>u.role==='student'),me=()=>S.users.find(u=>u.id===S.me);
const th=()=>S.cfg.th;
function st(id,pre){let p=0,a=0,l=0,e=0;for(const k in S.att){if(!k.startsWith(pre))continue;const v=S.att[k][id];v==='P'?p++:v==='A'?a++:v==='L'?l++:v==='E'&&e++}
 const t=p+a+l,c=p+(S.cfg.lateP?l:0);return{p,a,l,e,t,c,pc:t?Math.round(c/t*1000)/10:0}}
const av=(u,s=40)=>u.photo?`<img class="av" alt="" src="${u.photo}" style="width:${s}px;height:${s}px">`:`<span class="av" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,var(--pri),var(--acc))">${esc(u.name.replace(/^(Prof\.|Dr\.)\s*/,'').split(' ').map(w=>w[0]).slice(0,2).join(''))}</span>`;
const pill=p=>`<span class="pill ${p<th()?'low':p<th()+10?'mid':'good'}">${p}%</span>`,bar=p=>`<div class="meter"><i style="width:${p}%;background:${p<th()?'var(--bad)':'var(--ok)'}"></i></div>`;
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3400)}
const closeModal=()=>{$('#modal').innerHTML=''};
function ask(txt,fn){askFn=fn;$('#modal').innerHTML=`<div class="modal"><div class="card"><h3>Are you sure?</h3><p style="color:var(--mute)">${esc(txt)}</p><div class="row"><button class="btn bad" onclick="closeModal();askFn()">Yes</button><button class="btn" onclick="closeModal()">Cancel</button></div></div></div>`}
/* shortage / bunk calculator */
function advice(r){if(!r.t)return'No classes recorded yet.';const q=th()/100;
 if(r.pc>=th())return`✅ You can miss ${Math.max(0,Math.floor(r.c/q-r.t))} more class(es) and stay above ${th()}%.`;
 return`⚠ Attend the next ${Math.ceil((q*r.t-r.c)/(1-q))} class(es) in a row to reach ${th()}%.`}
/* ---------- AUTH ---------- */
function regForm(u){const edit=!!u;u=u||{};return`${edit?'':`<label for="role">I am a</label><select id="role" onchange="$('#pf').style.display=this.value=='student'?'block':'none';$('#sk').style.display=this.value=='teacher'?'block':'none'"><option value="student">Student</option><option value="teacher">Teacher (staff key needed)</option></select><div id="sk" style="display:none"><label for="sky">Staff key</label><input id="sky" type="password"></div>`}
<label for="nm">Full name</label><input id="nm" value="${esc(u.name)}" placeholder="e.g. Aman Sharma"><div class="g2"><div><label for="cl">Class</label><input id="cl" value="${esc(u.cls||'BCA Sem 3')}"></div><div><label for="dp">Department</label><input id="dp" value="${esc(u.dept||'Computer Science')}"></div></div>
${edit?'':`<label for="pw">Password (min 6 characters)</label><input id="pw" type="password">`}
<div id="pf"><div class="g2"><div><label for="pe">Parent email</label><input id="pe" type="email" value="${esc(u.pe)}"></div><div><label for="pp">Parent phone</label><input id="pp" value="${esc(u.pp)}" placeholder="98XXXXXXXX"></div></div></div>
<label>Photo</label><div class="row"><span id="pv">${av({name:'?',photo:ph||u.photo},44)}</span><input type="file" accept="image/*" onchange="photo(this)" style="flex:1"></div>
<button class="btn pri" style="width:100%;margin-top:16px" onclick="reg(${edit?u.id:''})">${edit?'Save changes':'Create account'}</button>`}
function photo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,120,120);ph=c.toDataURL('image/jpeg',.7);$('#pv').innerHTML=av({name:'?',photo:ph},44)};im.src=e.target.result};r.readAsDataURL(f)}
const nameTaken=(n,id)=>S.users.some(u=>u.id!==id&&u.name.toLowerCase()===n.toLowerCase());
async function reg(id){const name=$('#nm').value.trim(),pe=$('#pe').value.trim(),pp=normPh($('#pp').value);
 if(!name)return toast('Please enter a name');if(nameTaken(name,id))return toast('That name is already registered');if(!okMail(pe))return toast('Parent email looks invalid');
 if(id){const u=S.users.find(x=>x.id===id);Object.assign(u,{name,cls:$('#cl').value,dept:$('#dp').value,pe,pp,photo:ph||u.photo});ph='';audit('Edited '+name);save();closeModal();toast('Saved');return go('students')}
 const pw=$('#pw').value;if(pw.length<6)return toast('Password needs 6+ characters');
 const role=$('#role')?$('#role').value:'student';if(role==='teacher'&&$('#sky').value!==STAFF_KEY)return toast('Wrong staff key');
 const u={id:Date.now(),role,name,cls:$('#cl').value,dept:$('#dp').value,photo:ph,pw:await H(pw)};
 if(role==='student'){u.roll=Math.max(100,...studs().map(s=>s.roll))+1;u.pe=pe;u.pp=pp}
 S.users.push(u);ph='';S.me=u.id;audit('Registered '+name);save();go('dash')}
async function login(){const n=$('#ln').value.trim().toLowerCase(),r=$('#lr').value,u=S.users.find(x=>x.role===r&&x.name.toLowerCase()===n);
 if(u&&u.pw===await H($('#lp').value)){S.me=u.id;save();go('dash')}else toast('Wrong name or password')}
function authUI(){return`<div class="auth"><div class="hero"><div class="logo"><i>✓</i>ClassSync</div><h1>Attendance that<br>reports itself.</h1><p>Mark attendance in seconds, track every student, and prepare monthly reports for parents.</p><div class="chips"><span>🔐 Password login</span><span>📊 Live dashboard</span><span>🎯 Shortage calculator</span><span>🧾 Audit log</span><span>☕ Java backend</span></div></div>
<div class="form"><div class="card"><div class="tabs"><button class="${tab=='login'?'on':''}" onclick="tab='login';go()">Login</button><button class="${tab=='reg'?'on':''}" onclick="tab='reg';go()">Register</button></div>
${tab=='login'?`<label for="lr">Login as</label><select id="lr"><option value="teacher">Teacher</option><option value="student">Student</option></select><label for="ln">Full name</label><input id="ln"><label for="lp">Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><button class="btn pri" style="width:100%;margin-top:16px" onclick="login()">Login</button><p style="color:var(--mute);font-size:12px;margin:14px 0 0">Demo accounts: <b>Prof. Meera Joshi</b> / teacher123 · <b>Aman Sharma</b> / student123</p>`:regForm()}</div></div></div>`}
/* ---------- SHELL ---------- */
function go(v){const y=scrollY,same=!v||v===view;if(v){view=v;dirty=false}$('#tb').textContent=isDark()?'☀️':'🌙';
 if(v==='att')cur=JSON.parse(JSON.stringify(S.att[adate]||{}));const u=me();if(!u){closeModal();$('#root').innerHTML=authUI();return}
 const nav=u.role==='teacher'?[['dash','🏠 Dashboard'],['att','✅ Attendance'],['cal','📅 Calendar'],['students','👥 Students'],['reports','📨 Reports'],['set','⚙ Settings']]:[['dash','🏠 My attendance']];
 $('#root').innerHTML=`<div class="app"><aside class="side"><div class="logo" style="padding:4px 8px 14px"><i>✓</i>ClassSync</div>${nav.map(n=>`<button class="nav ${view==n[0]?'on':''}" onclick="nv('${n[0]}')">${n[1]}</button>`).join('')}<button class="nav" onclick="out()">↩ Logout</button><div class="me">${av(u,38)}<div>${esc(u.name)}<small>${esc(u.cls)} · ${esc(u.dept)}</small></div></div></aside><main>${u.role==='teacher'?{dash:rDash,att:rAtt,cal:rCal,students:rStud,reports:rRep,set:rSet}[view]():rMine(u)}</main></div>`;
 if(same)scrollTo(0,y)}
function nv(v){if(dirty&&view==='att')return ask('You have unsaved attendance changes. Leave without saving?',()=>{dirty=false;go(v)});go(v)}
function out(){ask('Log out of ClassSync?',()=>{S.me=null;save();go()})}
function theme(){S.theme=isDark()?'light':'dark';document.documentElement.dataset.theme=S.theme;save();$('#tb').textContent=isDark()?'☀️':'🌙'}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
/* ---------- TEACHER ---------- */
function rDash(){const s=studs(),t=S.att[T],pr=t?s.filter(u=>t[u.id]==='P'||t[u.id]==='L').length:null,avg=s.length?Math.round(s.reduce((a,u)=>a+st(u.id,CM).pc,0)/s.length):0,risk=s.filter(u=>st(u.id,'').t&&st(u.id,'').pc<th());
 const days=Object.keys(S.att).sort().slice(-7),pend=!S.log.some(l=>l.m===PM);
 return`<div class="head"><div><h2>Welcome back, ${esc(me().name.split(' ').slice(-1)[0])} 👋</h2><span style="color:var(--mute)">${today.toDateString()}</span></div><button class="btn pri" onclick="go('att')">Mark today’s attendance</button></div>
 ${pend?`<div class="banner"><div><b>📨 ${mname(PM)} reports are ready</b><br><small>Summaries for ${s.length} parents are waiting.</small></div><button class="btn" onclick="month='${PM}';go('reports')" style="color:var(--pri)">Review &amp; send</button></div>`:''}
 <div class="stats"><div class="card stat"><b>${s.length}</b><span>Total students</span></div><div class="card stat" style="border-color:var(--ok)"><b>${pr===null?'—':pr+'/'+s.length}</b><span>Present today</span></div><div class="card stat" style="border-color:var(--acc)"><b>${avg}%</b><span>Class average (this month)</span></div><div class="card stat" style="border-color:var(--bad)"><b>${risk.length}</b><span>Below ${th()}% (overall)</span></div></div>
 <div class="cols"><div class="card"><h3>Daily attendance (last 7 days)</h3><div class="bars">${days.map(k=>{const p=Math.round(s.filter(u=>['P','L'].includes(S.att[k][u.id])).length/(s.length||1)*100);return`<div><i style="height:${p*1.2}px"></i>${p}%<br>${k.slice(8)}/${k.slice(5,7)}</div>`}).join('')||'<p>No data yet.</p>'}</div></div>
 <div class="card"><h3>⚠ Needs attention</h3>${risk.length?risk.map(u=>{const r=st(u.id,'');return`<div class="who" style="margin-top:12px">${av(u,34)}<div style="flex:1">${esc(u.name)}<small>${advice(r).replace('⚠ ','')}</small></div>${pill(r.pc)}</div>`}).join(''):'<p style="color:var(--mute)">Everyone is above the limit 🎉</p>'}</div></div>`}
function rAtt(){const s=studs(),un=s.filter(u=>!cur[u.id]).length,hol=S.hol.includes(adate);
 return`<div class="head"><h2>Mark attendance</h2><div class="row"><input type="date" aria-label="Date" value="${adate}" max="${T}" onchange="adate=this.value;go('att')"><button class="btn" onclick="studs().forEach(u=>cur[u.id]='P');dirty=true;go()">All present</button><button class="btn ok" onclick="saveAtt()">Save</button></div></div>
 ${hol?'<p class="pill mid">This date is marked as a holiday in Settings.</p>':''}${sessCard()}<div class="card" style="margin-top:16px"><p style="margin:0 0 8px;color:var(--mute);font-size:13px">${un?`${un} student(s) not marked – they will be saved as Absent.`:'All students marked.'} E = Excused (leave, not counted).</p><div class="tw"><table><tr><th>Student</th><th>Status</th></tr>${s.map(u=>`<tr><td><div class="who">${av(u)}<div>${esc(u.name)}<small>Roll ${u.roll}</small></div></div></td><td><div class="seg" role="group" aria-label="Status for ${esc(u.name)}">${['P','A','L','E'].map(x=>`<button class="${x} ${cur[u.id]===x?'on':''}" aria-pressed="${cur[u.id]===x}" onclick="cur[${u.id}]='${x}';dirty=true;go()">${{P:'Present',A:'Absent',L:'Late',E:'Excused'}[x]}</button>`).join('')}</div></td></tr>`).join('')}</table></div></div>`}
function saveAtt(){const un=studs().filter(u=>!cur[u.id]);un.forEach(u=>cur[u.id]='A');S.att[adate]={...cur};audit('Saved attendance for '+adate);dirty=false;save();toast('Saved for '+adate+(un.length?` · ${un.length} unmarked set to Absent`:''));go('dash')}
function rStud(){return`<div class="head"><h2>Students</h2><div class="row"><button class="btn" onclick="bulk()">⬆ Import CSV</button><button class="btn pri" onclick="addS()">+ Add student</button></div></div><div class="grid">${studs().map(u=>{const r=st(u.id,'');return`<div class="card"><div class="who">${av(u,52)}<div>${esc(u.name)}<small>Roll ${u.roll} · ${esc(u.dept)}</small></div></div><p style="font-size:13px;color:var(--mute);margin:12px 0">👪 ${esc(u.pe||'—')}<br>📱 ${esc(u.pp||'—')}</p><div class="row">${bar(r.pc)}${pill(r.pc)}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="editS(${u.id})">Edit</button><button class="btn" onclick="delS(${u.id})">Delete</button></div></div>`}).join('')||'<p>No students yet. Add one or import a CSV.</p>'}</div>`}
const modal=h=>$('#modal').innerHTML=`<div class="modal"><div class="card"><div class="head" style="margin:0"><h3>${h[0]}</h3><button class="btn" aria-label="Close" onclick="closeModal()">✕</button></div>${h[1]}</div></div>`;
function addS(){ph='';modal(['Add student',regForm().replace(/<label for="role">[\s\S]*?<\/div><label for="nm"/,'<label for="nm"').replace(/<select id="role"[\s\S]*?<\/select>/,'')]);}
function editS(id){ph='';modal(['Edit student',regForm(S.users.find(u=>u.id===id))])}
function delS(id){const u=S.users.find(x=>x.id===id);ask(`Delete ${u.name} and their attendance records?`,()=>{S.users=S.users.filter(x=>x.id!==id);for(const k in S.att)delete S.att[k][id];audit('Deleted '+u.name);save();go('students')})}
function bulk(){modal(['Import students',`<p style="color:var(--mute);font-size:13px">One student per line: <b>name, parent email, parent phone</b>. Default password is the roll number.</p><textarea id="bt" rows="8" placeholder="Neha Rao, neha.parent@mail.com, 9876543210"></textarea><button class="btn pri" style="margin-top:10px" onclick="doBulk()">Import</button>`])}
async function doBulk(){let n=0,bad=0;for(const ln of $('#bt').value.split('\n')){const [name,pe,pp]=ln.split(',').map(x=>(x||'').trim());if(!name||nameTaken(name)||!okMail(pe)){ln.trim()&&bad++;continue}
 const roll=Math.max(100,...studs().map(s=>s.roll))+1;S.users.push({id:Date.now()+n,role:'student',roll,name,cls:'BCA Sem 3',dept:'Computer Science',pe,pp:normPh(pp),photo:'',pw:await H(String(roll))});n++}
 audit(`Imported ${n} students`);save();closeModal();toast(`Imported ${n}, skipped ${bad}`);go('students')}
/* ---------- REPORTS ---------- */
function msg(u,m){const r=st(u.id,m);return`Dear Parent,\n\nAttendance report for ${u.name} (${u.cls}, ${u.dept}) – ${mname(m)}\n\nTotal classes: ${r.t}\nPresent: ${r.p}\nAbsent: ${r.a}\nLate: ${r.l}${r.e?'\nExcused: '+r.e:''}\nAttendance: ${r.pc}%${S.cfg.lateP?' (late counted as present)':''}${r.pc<th()?`\n\n⚠ Attendance is below the required ${th()}%.`:''}\n\nRegards,\nClassSync`}
function rRep(){return`<div class="head"><h2>Monthly reports</h2><div class="row"><input type="month" aria-label="Month" value="${month}" onchange="month=this.value;go()"><button class="btn" onclick="csv()">⬇ CSV</button><button class="btn pri" onclick="sendAll()">📨 Mark as sent</button></div></div>
 <div class="card"><div class="tw"><table><tr><th>Student</th><th>Present</th><th>Absent</th><th>Late</th><th>Excused</th><th>Attendance</th><th></th></tr>${studs().map(u=>{const r=st(u.id,month);return`<tr><td><div class="who">${av(u,34)}${esc(u.name)}</div></td><td>${r.p}</td><td>${r.a}</td><td>${r.l}</td><td>${r.e}</td><td><div class="row" style="flex-wrap:nowrap">${bar(r.pc)}${pill(r.pc)}</div></td><td><button class="btn" onclick="prev(${u.id})">Preview</button></td></tr>`}).join('')}</table></div></div>
 <div class="card" style="margin-top:16px"><h3>Sent history</h3>${S.log.length?S.log.slice().reverse().map(l=>`<p style="margin:8px 0">✅ <b>${mname(l.m)}</b> – ${l.n} parents <span style="color:var(--mute)">· ${esc(l.at)}</span></p>`).join(''):'<p style="color:var(--mute)">No reports sent yet.</p>'}</div>`}
function prev(id){const u=S.users.find(x=>x.id===id),t=msg(u,month);modal(['Parent report preview',`<p style="color:var(--mute)">To: ${esc(u.pe||'no email')} · ${esc(u.pp||'no phone')}</p><pre>${esc(t)}</pre><div class="row"><a class="btn pri" target="_blank" rel="noopener" href="mailto:${esc(u.pe)}?subject=${encodeURIComponent('Attendance report – '+mname(month))}&body=${encodeURIComponent(t)}">✉ Email</a><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/${esc(normPh(u.pp))}?text=${encodeURIComponent(t)}">WhatsApp</a></div>`])}
function sendAll(){const n=studs().length;ask(`Record ${mname(month)} reports as sent for ${n} parents? (Actual delivery needs a backend or EmailJS – use Preview to send manually.)`,()=>{S.log.push({m:month,n,at:new Date().toLocaleString()});audit('Reports marked sent '+month);save();go()})}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
function csv(){const r=[['Roll','Name','Present','Absent','Late','Excused','Percent']].concat(studs().map(u=>{const x=st(u.id,month);return[u.roll,u.name,x.p,x.a,x.l,x.e,x.pc]}));const t=r.map(x=>x.map(q).join(',')).join('\n');
 window._csv=t;modal([`CSV – ${mname(month)}`,`<textarea id="csvt" readonly style="height:200px">${esc(t)}</textarea><div class="row" style="margin-top:10px"><button class="btn pri" onclick="$('#csvt').select();document.execCommand('copy');toast('Copied')">Copy</button><button class="btn" onclick="dl()">Download .csv</button></div><p style="color:var(--mute);font-size:12px">If download does nothing in this preview, use Copy.</p>`])}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+window._csv],{type:'text/csv'}));a.download='attendance-'+month+'.csv';a.click()}
/* ---------- SETTINGS ---------- */
function rSet(){const c=S.cfg;return`<div class="head"><h2>Settings</h2></div><div class="cols"><div class="card"><h3>Rules</h3><label for="sth">Minimum attendance %</label><input id="sth" type="number" min="1" max="100" value="${c.th}" onchange="S.cfg.th=Math.min(100,Math.max(1,+this.value||75));save();go()"><label><input type="checkbox" style="width:auto" ${c.lateP?'checked':''} onchange="S.cfg.lateP=this.checked;save();go()"> Count Late as Present</label><label><input type="checkbox" style="width:auto" ${c.sat?'checked':''} onchange="S.cfg.sat=this.checked;save()"> Saturday is a working day (applies to new demo data)</label>
 <h3 style="margin-top:20px">Holidays</h3><div class="row"><input type="date" id="hd"><button class="btn" onclick="addH()">Add</button></div>${S.hol.sort().map(h=>`<p style="margin:6px 0">${h} <button class="btn" onclick="S.hol=S.hol.filter(x=>x!=='${h}');save();go()">✕</button></p>`).join('')}
 <h3 style="margin-top:20px">Data</h3><button class="btn bad" onclick="ask('Delete ALL data and restore demo data?',async()=>{localStorage.removeItem('classsync2');await seed();save();go()})">Reset everything</button></div>
 <div class="card"><h3>🧾 Audit log</h3>${S.audit.length?S.audit.slice().reverse().slice(0,30).map(a=>`<p style="margin:8px 0;font-size:13px"><b>${esc(a.t)}</b><br><span style="color:var(--mute)">${esc(a.by)} · ${esc(a.at)}</span></p>`).join(''):'<p style="color:var(--mute)">No changes yet.</p>'}</div></div>`}
function addH(){const v=$('#hd').value;if(v&&!S.hol.includes(v)){S.hol.push(v);audit('Holiday added '+v);save();go()}}
/* ---------- CHECK-IN ---------- */
const cd=()=>{const t=Math.max(0,Math.ceil((S.sess.exp-Date.now())/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function startSess(){S.sess={code:rnd(),start:Date.now(),exp:Date.now()+120000,date:T};audit('Check-in code started');save();go()}
function sessCard(){const s=S.sess,live=s&&s.exp>Date.now();return`<div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between"><div><h3>🔐 Student self check-in</h3><p style="color:var(--mute);margin:4px 0 0;font-size:13px">Code valid 2 minutes. Students who enter it after the first 10 minutes of class are marked Late. Works across devices through the Java server.</p></div>${live?`<div style="text-align:center"><div style="font-size:34px;font-weight:800;letter-spacing:6px;color:var(--pri)">${s.code}</div><small style="color:var(--mute)">expires in <b id="cd">${cd()}</b></small></div><button class="btn" onclick="S.sess=null;save();go()">Stop</button>`:`<button class="btn pri" onclick="startSess()">Generate code</button>`}</div>`}
function selfCard(u){const t=(S.att[T]||{})[u.id];return`<div class="card" style="margin-bottom:16px"><h3>📍 Mark today’s attendance</h3>${t?`<p>You’re marked <span class="pill ${t=='A'?'low':'good'}">${{P:'Present',A:'Absent',L:'Late',E:'Excused'}[t]}</span> for today.</p>`:`<p style="color:var(--mute);margin:4px 0 12px;font-size:13px">Enter the 6-digit code shown by your teacher.</p><div class="row"><input id="code" aria-label="Code" maxlength="6" inputmode="numeric" placeholder="000000" style="max-width:170px;font-size:20px;letter-spacing:4px;text-align:center"><button class="btn pri" onclick="selfMark()">Mark me present</button></div>`}</div>`}
async function selfMark(){const c=$('#code').value.trim();await sync();const u=me(),s=S.sess;if(!s||s.exp<=Date.now())return toast('No active code – ask your teacher');if(c!==s.code)return toast('Wrong code, try again');
 const late=Date.now()-s.start>600000;(S.att[T]=S.att[T]||{})[u.id]=late?'L':'P';audit(u.name+' self check-in');save();toast(late?'Marked Late':'✅ Attendance marked');go()}
/* ---------- STUDENT ---------- */
const calNav=()=>`<div class="row"><button class="btn" aria-label="Previous month" onclick="shift(-1)">‹</button><b style="min-width:140px;text-align:center">${mname(cal)}</b><button class="btn" aria-label="Next month" onclick="shift(1)">›</button></div>`;
function shift(n){cal=iso(new Date(+cal.slice(0,4),+cal.slice(5,7)-1+n,1)).slice(0,7);go()}
const legend=t=>`<div class="row" style="margin-top:14px">${t?`<span class="pill good">${th()+10}%+</span><span class="pill mid">${th()}–${th()+10}%</span><span class="pill low">Below ${th()}%</span>`:'<span class="pill good">Present</span><span class="pill low">Absent</span><span class="pill mid">Late</span><span class="pill" style="background:#4f46e522;color:var(--pri)">Excused</span>'}</div>`;
function trend(id){const ms=[...new Set(Object.keys(S.att).map(k=>k.slice(0,7)))].sort().slice(-6);return`<div class="bars" style="height:120px">${ms.map(m=>{const p=st(id,m).pc;return`<div><i style="height:${p*.8}px"></i>${p}%<br>${m.slice(5)}/${m.slice(2,4)}</div>`}).join('')}</div>`}
function rMine(u){const r=st(u.id,cal),all=st(u.id,''),y=+cal.slice(0,4),m=+cal.slice(5,7)-1,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="background:none"></div>'.repeat(first);
 for(let d=1;d<=n;d++){const k=`${cal}-${String(d).padStart(2,'0')}`,v=(S.att[k]||{})[u.id];c+=`<div class="${v||(S.hol.includes(k)?'H':'')} ${k===T?'tod':''}">${d}</div>`}
 return`${selfCard(u)}<div class="head"><h2>My attendance</h2>${calNav()}</div><div class="cols"><div class="card"><div class="who" style="font-size:18px">${av(u,64)}<div>${esc(u.name)}<small>Roll ${u.roll||'—'} · ${esc(u.cls)}</small></div></div><div class="stats" style="margin:18px 0 0"><div class="card stat" style="border-color:var(--ok)"><b>${r.p}</b><span>Present</span></div><div class="card stat" style="border-color:var(--bad)"><b>${r.a}</b><span>Absent</span></div><div class="card stat" style="border-color:var(--warn)"><b>${r.l}</b><span>Late</span></div><div class="card stat"><b>${r.pc}%</b><span>This month</span></div></div>
 <p class="pill ${all.pc<th()?'low':'good'}" style="display:block;margin-top:16px">Overall ${all.pc}% · ${advice(all)}</p><h3 style="margin:16px 0 0">Monthly trend</h3>${trend(u.id)}</div><div class="card"><h3 style="margin-bottom:12px">${mname(cal)}</h3><div class="cal">${c}</div>${legend()}</div></div>`}
function rCal(){const s=studs(),y=+cal.slice(0,4),m=+cal.slice(5,7)-1,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="background:none"></div>'.repeat(first);
 for(let d=1;d<=n;d++){const k=`${cal}-${String(d).padStart(2,'0')}`,a=S.att[k];let cl=S.hol.includes(k)?'H':'',tx='';if(a){const p=Math.round(s.filter(u=>['P','L'].includes(a[u.id])).length/(s.length||1)*100);cl=p>=th()+10?'P':p>=th()?'L':'A';tx=`<small>${p}%</small>`}c+=`<div class="${cl} ${k===T?'tod':''} ${k<=T?'clk':''}" ${k<=T?`onclick="adate='${k}';go('att')"`:''}>${d}${tx}</div>`}
 return`<div class="head"><h2>Attendance calendar</h2>${calNav()}</div><div class="card"><div class="cal big">${c}</div>${legend(1)}<p style="color:var(--mute);font-size:13px">Tap any day to view or edit. Colours show class-wide attendance for that day (not Late). Struck-through days are holidays.</p></div>`}
/* timer: updates only the countdown, never re-renders the page */
setInterval(()=>{const e=$('#cd');if(e&&S.sess)e.textContent=S.sess.exp<=Date.now()?'expired':cd()},1000);
setInterval(async()=>{if(!online||!S||!S.me||dirty||saveT&&online===null||document.querySelector('.modal')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(await sync())go()},5000);
(async()=>{let L=null;try{L=JSON.parse(localStorage.getItem(LOC)||'null')}catch(e){}
 try{const t=await pull();online=true;if(t){S=JSON.parse(t);lastSrv=t}else S=L}catch(e){online=false;S=L}
 if(!S)await seed();else if(L&&online){S.me=L.me;S.theme=L.theme}
 S.hol=S.hol||[];S.audit=S.audit||[];
 if(online&&!lastSrv)push();
 if(S.theme)document.documentElement.dataset.theme=S.theme;go()})();
</script></body></html>
